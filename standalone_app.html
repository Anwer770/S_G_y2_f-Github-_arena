      } catch (e) {
        console.error('Storage load error:', e);
        return fallback;
      }

    const INITIAL_CUSTODY = [
      { id: 'cst-1', title: 'عهدة نقدية للمصروفات النثرية والانتقالات', responsiblePerson: 'أحمد صالح (أمين الصندوق)', custodyType: 'نقدية', amount: 500, issueDate: '2026-08-01', status: 'قيد المتابعة', notes: 'تُجدد عند الوصول إلى 100$' },
      { id: 'cst-2', title: 'جهاز لابتوب HP مخصص لإدارة المخازن والمبيعات', responsiblePerson: 'ماهر العنسي (مسؤول التوزيع)', custodyType: 'أجهزة ومعدات', amount: 800, issueDate: '2026-07-15', status: 'معلق', notes: 'عهدة عينية رقم تسلسلي HP-9921' }

    const INITIAL_LINKS = [
      { id: 'l-1', title: 'Google Gemini Studio & AI API', url: 'https://aistudio.google.com/', category: 'ذكاء اصطناعي', classification: 'أدوات تطوير', importance: 'A', type: 'رسمي', isAi: true, isFavorite: true, visitCount: 45 },
      { id: 'l-2', title: 'ChatGPT OpenAI Assistant', url: 'https://chatgpt.com/', category: 'ذكاء اصطناعي', classification: 'مساعد ذكي', importance: 'A', type: 'مجاني', isAi: true, isFavorite: true, visitCount: 88 },
      { id: 'l-3', title: 'Canva Design & Social Kits', url: 'https://www.canva.com/', category: 'تصميم ومونتاج', classification: 'دعاية وإعلان', importance: 'B', type: 'رسمي', isAi: false, isFavorite: false, visitCount: 12 }
    ];

    const INITIAL_NOTES = [
      { id: 'n-1', title: 'محضر اجتماع خطة التوزيع والتوسع الربع سنوي', content: 'تم الاتفاق على توسيع خطة التغطية لتشمل 25 صيدلية إضافية، وتخصيص نسبة 5% عينات ترويجية للأطباء ذوي التصنيف Class A+.', tags: ['مبيعات', 'استراتيجية'], isPinned: true, isFavorite: true, isTrashed: false, updatedAt: Date.now() },
      { id: 'n-2', title: 'توجيهات الحسابات ومواعيد ترحيل القيود', content: 'يجب ترحيل كافة السندات النقدية قبل الساعة 6 مساءً يومياً ومطابقة الصندوق بحضور أمين الصندوق والمدير المالي.', tags: ['محاسبة', 'إدارة'], isPinned: false, isFavorite: false, isTrashed: false, updatedAt: Date.now() }
    ];

    // =========================================================================
    // 2. MAIN APPLICATION COMPONENT (المكون الرئيسي)
    // =========================================================================
    function App() {
      // Navigation Tab
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);
      const [isMobileSidebarOpen, setIsMobileSidebarOpen] = useState(false);

      // Data States
      const [products, setProducts] = useState(() => loadData('products', INITIAL_PRODUCTS));
      const [stockMovements, setStockMovements] = useState(() => loadData('stock_movements', INITIAL_STOCK_MOVEMENTS));
      const [financial, setFinancial] = useState(() => loadData('financial', INITIAL_FINANCIAL));
      const [debts, setDebts] = useState(() => loadData('debts', INITIAL_DEBTS));
      const [customers, setCustomers] = useState(() => loadData('customers', INITIAL_CUSTOMERS));
      const [customerVisits, setCustomerVisits] = useState(() => loadData('customer_visits', INITIAL_CUSTOMER_VISITS));
      const [doctors, setDoctors] = useState(() => loadData('doctors', INITIAL_DOCTORS));
      const [doctorVisits, setDoctorVisits] = useState(() => loadData('doctor_visits', INITIAL_DOCTOR_VISITS));
      const [tasks, setTasks] = useState(() => loadData('tasks', INITIAL_TASKS));
      const [routines, setRoutines] = useState(() => loadData('routines', INITIAL_ROUTINES));
      const [custody, setCustody] = useState(() => loadData('custody', INITIAL_CUSTODY));
      const [links, setLinks] = useState(() => loadData('links', INITIAL_LINKS));
      const [notes, setNotes] = useState(() => loadData('notes', INITIAL_NOTES));

      // Notification / Toast
      const [toastMessage, setToastMessage] = useState(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // Auto-save effects
      useEffect(() => saveData('products', products), [products]);
      useEffect(() => saveData('stock_movements', stockMovements), [stockMovements]);
      useEffect(() => saveData('financial', financial), [financial]);
      useEffect(() => saveData('debts', debts), [debts]);
      useEffect(() => saveData('customers', customers), [customers]);
      useEffect(() => saveData('customer_visits', customerVisits), [customerVisits]);
      useEffect(() => saveData('doctors', doctors), [doctors]);
      useEffect(() => saveData('doctor_visits', doctorVisits), [doctorVisits]);
      useEffect(() => saveData('tasks', tasks), [tasks]);
      useEffect(() => saveData('routines', routines), [routines]);
      useEffect(() => saveData('custody', custody), [custody]);
      useEffect(() => saveData('links', links), [links]);
      useEffect(() => saveData('notes', notes), [notes]);

      // Global Calculations
      const stockBalances = useMemo(() => {
        const balances = {};
        products.forEach(p => {
          balances[p.id] = p.openingBalance;
        });
        stockMovements.forEach(m => {
          m.items.forEach(item => {
            if (balances[item.itemId] !== undefined) {
              if (m.type === 'وارد') balances[item.itemId] += Number(item.quantity);
              if (m.type === 'منصرف') balances[item.itemId] -= Number(item.quantity);
            }
          });
        });
        return balances;
      }, [products, stockMovements]);

      const financialStats = useMemo(() => {
        let inflow = 0;
        let outflow = 0;
        financial.forEach(f => {
          const amt = Number(f.amount) || 0;
          if (f.type === 'إيراد' || f.type === 'سند قبض') inflow += amt;
          if (f.type === 'مصروف' || f.type === 'سند صرف') outflow += amt;
        });
        return {
          inflow,
          outflow,
          balance: inflow - outflow
        };
      }, [financial]);

      const debtsStats = useMemo(() => {
        let forUs = 0;
        let onUs = 0;
        debts.forEach(d => {
          const rem = Number(d.remainingAmount) || 0;
          if (d.type === 'لنا') forUs += rem;
          if (d.type === 'علينا') onUs += rem;
        });
        return { forUs, onUs };
      }, [debts]);

      // Backup & Restore
      const exportUnifiedBackup = () => {
        const payload = {
          app: "المنظومة الإدارية والمحاسبية وإدارة العملاء والأطباء والديون والمعرفة المتكاملة",
          version: "2.7.0",
          exportedAt: new Date().toISOString(),
          data: {
            products,
            stockMovements,
            financial,
            debts,
            customers,
            customerVisits,
            doctors,
            doctorVisits,
            tasks,
            routines,
            custody,
            links,
            notes
          }
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `AL_MANZUMA_BACKUP_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('تم تصدير ملف النسخة الاحتياطية الموحدة بنجاح!');
      };

      const handleImportBackup = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.data) {
              const d = parsed.data;
              if (d.products) setProducts(d.products);
              if (d.stockMovements) setStockMovements(d.stockMovements);
              if (d.financial) setFinancial(d.financial);
              if (d.debts) setDebts(d.debts);
              if (d.customers) setCustomers(d.customers);
              if (d.customerVisits) setCustomerVisits(d.customerVisits);
              if (d.doctors) setDoctors(d.doctors);
              if (d.doctorVisits) setDoctorVisits(d.doctorVisits);
              if (d.tasks) setTasks(d.tasks);
              if (d.routines) setRoutines(d.routines);
              if (d.custody) setCustody(d.custody);
              if (d.links) setLinks(d.links);
              if (d.notes) setNotes(d.notes);
              showToast('تمت استعادة البيانات ومطابقتها بنجاح!');
            } else {
              alert('ملف غير متوافق');
            }
          } catch (err) {
            alert('خطأ في قراءة ملف النسخة الاحتياطية');
          }
        };
        reader.readAsText(file);
      };

      const navItems = [

        { id: 'financial', label: 'السجل المالي اليومي', icon: '💳', count: financial.length, group: 'المالية' },
        { id: 'debts', label: 'الديون والالتزامات', icon: '🪙', count: debts.length, group: 'المالية' },
        { id: 'stock', label: 'المخزون وحركات الأصناف', icon: '📦', count: products.length, group: 'المخازن' },
        { id: 'tasks', label: 'المهام ومصفوفة آيزنهاور', icon: '✅', count: tasks.filter(t=>!t.isCompleted).length, group: 'الإنتاجية' },
        { id: 'routines', label: 'الروتين والعادات اليومية', icon: '🔥', count: routines.length, group: 'الإنتاجية' },
        { id: 'customers', label: 'العملاء وخطوط السير (CRM)', icon: '👥', count: customers.length, group: 'العلاقات' },
        { id: 'doctors', label: 'زيارات الأطباء والدعاية', icon: '🩺', count: doctors.length, group: 'العلاقات' },
        { id: 'custody', label: 'العهد والإشكاليات المعلقة', icon: '🛡️', count: custody.length, group: 'الرقابة' },
        { id: 'links', label: 'مكتبة الروابط الذكية', icon: '🌐', count: links.length, group: 'المعرفة' },
        { id: 'notes', label: 'الملاحظات وقاعدة المعرفة', icon: '📚', count: notes.length, group: 'المعرفة' },
        { id: 'settings', label: 'النسخ الاحتياطي والإعدادات', icon: '⚙️', group: 'النظام' }
      ];

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 text-slate-900" dir="rtl">
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-5 left-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-indigo-500 animate-bounce">
              <span className="text-emerald-400 font-bold">✓</span>
              <span className="text-sm font-bold">{toastMessage}</span>
            </div>
          )}

          {/* RIGHT-HAND SIDEBAR */}
          <aside
            id="app-sidebar"
            className={`fixed top-0 right-0 h-screen bg-slate-900 text-slate-100 z-50 flex flex-col border-l border-slate-800 transition-all duration-300 shadow-2xl ${
              isSidebarCollapsed ? 'w-20' : 'w-72'
            } ${isMobileSidebarOpen ? 'translate-x-0' : 'translate-x-full lg:translate-x-0'}`}
          >
            {/* Brand Header */}
            <div className="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/70">
              <div 
                onClick={() => setActiveTab('dashboard')} 
                className="flex items-center gap-3 cursor-pointer overflow-hidden"
              >
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-teal-500 flex items-center justify-center text-white font-black text-xl shadow-lg shrink-0">
                  م
                </div>
                {!isSidebarCollapsed && (
                  <div className="min-w-0">
                    <h1 className="text-sm font-black text-white truncate">المنظومة الشاملة</h1>
                    <p className="text-[11px] text-slate-400 truncate">v2.7 Offline Standalone</p>
                  </div>
                )}
              </div>

              <button
                onClick={() => setIsSidebarCollapsed(!isSidebarCollapsed)}

                  <p className="text-xs text-slate-500">تم تفعيل وإتاحة محرك التخزين المحلي والبيانات الافتراضية لهذا الدفتر بنجاح.</p>
                  <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 font-mono text-xs overflow-x-auto text-slate-700 max-h-96">
                    {activeTab === 'customers' && JSON.stringify(customers, null, 2)}
                    {activeTab === 'doctors' && JSON.stringify(doctors, null, 2)}
                    {activeTab === 'custody' && JSON.stringify(custody, null, 2)}
                    {activeTab === 'links' && JSON.stringify(links, null, 2)}
                    {activeTab === 'notes' && JSON.stringify(notes, null, 2)}
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
